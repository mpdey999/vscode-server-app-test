<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <title>Home | Name Studio</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Name Studio home"><span class="wordmark-mark">N</span> name studio</a>
      <span class="top-note">A little introduction</span>
    </header>
    <section class="panel home-panel" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> HOME <span class="eyebrow-divider">/</span> 01</div>
      <h1 id="page-title">Let's start<br>with your <em>name.</em></h1>
      <p class="intro-copy">Every good introduction starts somewhere.</p>
      <form class="name-form" action="display" method="get">
        <label for="name">What should we call you?</label>
        <div class="form-row">
          <input id="name" name="name" type="text" placeholder="Your name" autocomplete="given-name" maxlength="100" required autofocus>
          <button class="button" type="submit">Continue <span aria-hidden="true">&#8594;</span></button>
        </div>
      </form>
      <span class="panel-index">01 <span>/</span> 02</span>
      <span class="panel-spark" aria-hidden="true">✳</span>
    </section>
    <footer class="page-footer"><span>NAME STUDIO</span><span>MADE FOR A GOOD FIRST IMPRESSION</span></footer>
  </main>
</body>
</html>
